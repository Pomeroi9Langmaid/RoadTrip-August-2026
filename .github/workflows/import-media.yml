name: Import road-trip media

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-media.yml'

permissions:
  contents: write

jobs:
  import-media:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download prepared media pack from personal Google Drive
        run: |
          python -m pip install --quiet gdown
          gdown 1I18RNva8-QEhtY6HAttYoICz3SXB8yey -O /tmp/roadtrip-media.zip
          test -s /tmp/roadtrip-media.zip

      - name: Unpack and validate media
        run: |
          unzip -o /tmp/roadtrip-media.zip -d .
          test -d media
          test -d thumbs
          test "$(find media -type f | wc -l)" -ge 57
          test "$(find thumbs -type f | wc -l)" -ge 57

      - name: Commit media and retire importer
        run: |
          git config user.name "Road Trip Media Importer"
          git config user.email "actions@users.noreply.github.com"
          git add media thumbs MEDIA-NOTE.txt
          git rm .github/workflows/import-media.yml
          git commit -m "Import road trip photos and videos"
          git push origin HEAD:main
