name: Assign Ritamaki image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/assign-ritamaki-image.yml'

permissions:
  contents: write

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Move image from Unassigned to Ritamaki
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('trip-data.js')
          text = p.read_text()
          item = 'M("51C60866-34D8-45B8-8630-62526AC3E7FF","51C60866-34D8-45B8-8630-62526AC3E7FF.png","photo","media/51C60866-34D8-45B8-8630-62526AC3E7FF.jpg","thumbs/51C60866-34D8-45B8-8630-62526AC3E7FF.jpg",null,null,null,null),\n'
          if text.count(item) != 1:
              raise SystemExit('Expected exactly one 51C60866 media entry')
          text = text.replace(item, '', 1)
          anchor = '{...{"id":"ritamaki","day":3,"date":"2026-08-11","title":"Ritamäki finngård","subtitle":"Finnskogen · 7‑torpsleden","lat":60.149036,"lng":12.541905,"kind":"walk","routeWaypoint":false,"confidence":"exact-gps","cover":"IMG_4486"},media:[\n'
          if anchor not in text:
              raise SystemExit('Ritamaki anchor not found')
          text = text.replace(anchor, anchor + item, 1)
          p.write_text(text)
          PY

      - name: Commit assignment and retire workflow
        run: |
          git config user.name "Road Trip Editor"
          git config user.email "actions@users.noreply.github.com"
          git add trip-data.js
          git rm .github/workflows/assign-ritamaki-image.yml
          git commit -m "Assign image to Ritamaki"
          git push origin HEAD:main
