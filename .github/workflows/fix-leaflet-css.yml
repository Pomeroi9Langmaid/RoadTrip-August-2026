name: Fix Leaflet stylesheet

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-leaflet-css.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Correct Leaflet CSS integrity hash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'sha256-p4NxAoJBhIINfQ3ynQJZ8gTugazYfFl7AFYhRZq9t0E='
          new = 'sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY='
          if old not in s:
              raise SystemExit('Expected bad Leaflet hash not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit fix and retire workflow
        run: |
          git config user.name "Road Trip Fix"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-leaflet-css.yml
          git commit -m "Fix Leaflet stylesheet integrity"
          git push origin HEAD:main
