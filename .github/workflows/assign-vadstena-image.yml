name: Assign Vadstena image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/assign-vadstena-image.yml'

permissions:
  contents: write

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Move image from Unassigned to Vadstena
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('trip-data.js')
          text = p.read_text()
          item = 'M("A529E6AB-B492-4572-B195-9F7ABF642C82","A529E6AB-B492-4572-B195-9F7ABF642C82.png","photo","media/A529E6AB-B492-4572-B195-9F7ABF642C82.jpg","thumbs/A529E6AB-B492-4572-B195-9F7ABF642C82.jpg",null,null,null,null),\n'
          if text.count(item) != 1:
              raise SystemExit('Expected exactly one A529 media entry')
          text = text.replace(item, '', 1)
          anchor = '{...{"id":"vadstena","day":6,"date":"2026-08-14","title":"Vadstena Youth Hostel","subtitle":"Night 6 · 14–15 August","lat":58.44592,"lng":14.89912,"kind":"overnight","routeWaypoint":true,"confidence":"verified-address","address":"Skänningegatan 20, 592 31 Vadstena"},media:[\n'
          if anchor not in text:
              raise SystemExit('Vadstena anchor not found')
          text = text.replace(anchor, anchor + item, 1)
          text = text.replace('notes:["Media currently covers 9–11 August. The 12–15 August overnight anchors are mapped, but no GPS media for those dates was present in this ZIP."]', 'notes:["Timestamped GPS media currently covers 9–11 August. One undated image has been manually identified as Vadstena; the later days still need their timestamped/GPS media."]')
          p.write_text(text)
          PY

      - name: Commit assignment and retire workflow
        run: |
          git config user.name "Road Trip Editor"
          git config user.email "actions@users.noreply.github.com"
          git add trip-data.js
          git rm .github/workflows/assign-vadstena-image.yml
          git commit -m "Assign image to Vadstena"
          git push origin HEAD:main
