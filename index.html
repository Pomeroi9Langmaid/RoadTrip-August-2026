<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#12313d" />
  <title>Lisa & Andrew’s Scenic Swedish Road Trip — August 2026</title>
  <base href="https://cdn.jsdelivr.net/gh/Pomeroi9Langmaid/RoadTrip-August-2026@10d8fb98bd1362d8226e7763250ce8a81ea2dd1a/" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="map-fixes.css" />
  <link rel="stylesheet" href="callouts.css" />
  <link rel="stylesheet" href="media-manager.css" />
  <link rel="stylesheet" href="accommodation-ui.css" />
  <link rel="stylesheet" href="media-map-ui.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <h1>Lisa & Andrew’s Scenic Swedish Road Trip</h1>
      <p>9–15 August 2026 · 7 days · 6 nights · Sweden</p>
    </div>
    <nav id="dayTabs" class="day-tabs" aria-label="Trip days"></nav>
    <div class="header-actions">
      <button id="itineraryToggle" class="header-button"><span>Itinerary</span></button>
      <button id="fullscreenToggle" class="header-button"><span>Fullscreen</span></button>
      <button id="editToggle" class="header-button" data-edit>Edit</button>
    </div>
  </header>

  <main class="app-main">
    <section id="mapShell" class="map-shell">
      <div id="map" aria-label="Interactive route map"></div>
      <div class="map-tools"><button id="fitRoute" class="map-tool">Fit whole route</button></div>
      <div class="route-chip"><span class="route-chip__line"></span><strong id="routeText">Clockwise road trip · ≈1,550 km</strong></div>

      <aside id="itineraryPanel" class="itinerary-panel" aria-label="Trip itinerary">
        <div class="panel-head"><div><h2>Trip itinerary</h2><p>Overnight stays and scenic highlights</p></div><button id="closeItinerary" class="icon-button" aria-label="Close itinerary">×</button></div>
        <div id="itineraryContent" class="panel-scroll"></div>
      </aside>

      <section id="galleryDrawer" class="gallery-drawer" aria-hidden="true">
        <div class="gallery-head"><button id="closeGallery" class="icon-button" aria-label="Close gallery">×</button><div><h2 id="galleryTitle"></h2><p id="galleryMeta"></p></div></div>
        <div id="galleryHero" class="gallery-hero"></div><div id="galleryGrid" class="media-grid"></div>
      </section>

      <section id="adminTray" class="admin-tray" hidden>
        <div class="admin-head"><strong>Unassigned media</strong><span id="unassignedCount"></span><button id="exportEdits" class="tiny-button">Export edits</button><button id="resetEdits" class="tiny-button">Reset</button></div>
        <div id="unassignedGrid" class="media-grid"></div>
      </section>
    </section>
  </main>

  <div id="lightbox" class="lightbox">
    <button id="closeLightbox" class="lightbox-close" aria-label="Close media">×</button>
    <button id="prevMedia" class="lightbox-nav lightbox-prev" aria-label="Previous media">‹</button>
    <div id="lightboxStage" class="lightbox-stage"></div>
    <button id="nextMedia" class="lightbox-nav lightbox-next" aria-label="Next media">›</button>
    <div id="lightboxCaption" class="lightbox-caption"></div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="map-bridge.js"></script>
  <script src="trip-data.js"></script>
  <script src="manual-media-assignments.js"></script>
  <script src="scenic-data.js"></script>
  <script src="scenic-layout.js"></script>
  <script src="route-weather.js"></script>
  <script src="route-direct.js"></script>
  <script src="app.js"></script>
  <script src="accommodation-art.js"></script>
  <script src="media-map-ui.js"></script>
  <script src="media-manager.js"></script>
  <script src="callouts-safe.js"></script>
  <script src="scenic-visibility.js"></script>
  <script src="map-presentation.js"></script>
</body>
</html>
